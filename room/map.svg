<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1060" width="1000" height="1060" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">空、鶴を聴く　部屋の見取り図（第一版・骨組み）</title>
  <desc id="map-desc">床を上から見た平面図のまわりに、四方の壁を外側へ倒して並べた展開図。北の壁にフェルメール「天文学者」「地理学者」、西の壁に曽我蕭白「林和靖図」と三日月の見える窓、床に苔のテラリウム、砂時計、ルクスの水槽がある。</desc>

  <!--
    空、鶴を聴く　部屋の見取り図　第一版（骨組み）

    ・床は上から見た図。四方の壁は、床のふちを折り目にして外側へ倒した展開図。
    ・壁のグループ（wall-*）の中は、その壁に向かって立ったときの座標で描いてある。
      左上が (0,0)、横は壁の幅（北・南は 480、東・西は 400）、縦は天井 (0) から床 (200) まで。
      外へ倒す向きは各グループの transform が受け持つので、細部を足すときは回転を気にせず描けばよい。
    ・床のグループ（floor）の中は、北を上にした座標。左上が北西の隅 (0,0)、右下が南東の隅 (480,400)。
    ・置いたものは一つずつ <g id="..."> にまとめてある。拡大すると見つかる細部は、それぞれのグループの中に足していく。
  -->

  <style>
    text { font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", serif; fill: #333; }
    .wall { fill: #ece5d6; stroke: #8a8070; stroke-width: 1; }
    .floor { fill: #f4efe4; stroke: #3a3a3a; stroke-width: 2; }
    .frame { fill: #3b2f2a; }
    .canvas { fill: #f7f2e7; }
    .label { font-size: 15px; text-anchor: middle; }
    .sub { font-size: 11px; text-anchor: middle; fill: #666; }
    .wall-name { font-size: 13px; text-anchor: middle; fill: #555; }
    .note { font-size: 13px; fill: #555; }
  </style>

  <rect width="1000" height="1060" fill="#faf7f0"/>

  <g id="room">

    <!-- 北の壁：床のふちを下にして、上へ起こした向き -->
    <g id="wall-north" transform="translate(260,150)">
      <rect class="wall" width="480" height="200"/>

      <g id="vermeer-astronomer">
        <title>フェルメール「天文学者」</title>
        <rect class="frame" x="105" y="40" width="100" height="113"/>
        <rect class="canvas" x="115" y="50" width="80" height="93"/>
        <text class="label" x="155" y="96">天文学者</text>
        <text class="sub" x="155" y="116">フェルメール</text>
      </g>

      <g id="vermeer-geographer">
        <title>フェルメール「地理学者」</title>
        <rect class="frame" x="275" y="40" width="100" height="113"/>
        <rect class="canvas" x="285" y="50" width="80" height="93"/>
        <text class="label" x="325" y="96">地理学者</text>
        <text class="sub" x="325" y="116">フェルメール</text>
      </g>
    </g>

    <!-- 東の壁：まだ何も掛けていない -->
    <g id="wall-east" transform="translate(940,350) rotate(90)">
      <rect class="wall" width="400" height="200"/>
    </g>

    <!-- 南の壁：まだ何も掛けていない -->
    <g id="wall-south" transform="translate(740,950) rotate(180)">
      <rect class="wall" width="480" height="200"/>
    </g>

    <!-- 西の壁：左が南、右が北 -->
    <g id="wall-west" transform="translate(60,750) rotate(-90)">
      <rect class="wall" width="400" height="200"/>

      <g id="shohaku-rinnasei">
        <title>曽我蕭白「林和靖図」</title>
        <rect class="frame" x="90" y="35" width="90" height="130"/>
        <rect class="canvas" x="98" y="43" width="74" height="114"/>
        <text class="label" x="135" y="96">林和靖図</text>
        <text class="sub" x="135" y="116">曽我蕭白</text>
      </g>

      <g id="window-west">
        <title>西の窓</title>
        <rect x="240" y="40" width="90" height="100" fill="#d9d1c0" stroke="#8a8070"/>
        <rect x="246" y="46" width="78" height="88" fill="#2f3a56"/>

        <g id="crescent-moon">
          <title>三日月</title>
          <!-- 夕方の西の空の三日月なので、右下が光っている -->
          <path d="M 298 62 A 14 14 0 0 1 298 90 A 9 14 0 0 0 298 62 Z" fill="#f3e6b0" transform="rotate(30 298 76)"/>
        </g>
      </g>
    </g>

    <!-- 床：北を上にして、上から見た向き -->
    <g id="floor" transform="translate(260,350)">
      <rect class="floor" width="480" height="400"/>
      <text class="note" x="14" y="24">床（上から見た図）</text>

      <g id="moss-terrarium">
        <title>苔のテラリウム</title>
        <circle cx="120" cy="210" r="40" fill="#eef5f2" stroke="#9fb7b0" stroke-width="1.5"/>
        <circle cx="120" cy="210" r="30" fill="#7f9f6a" opacity="0.6"/>
        <text class="label" x="120" y="274">苔のテラリウム</text>
      </g>

      <g id="hourglass">
        <title>砂時計</title>
        <rect x="222" y="272" width="36" height="36" rx="4" fill="#c9b08a" stroke="#7a6548"/>
        <circle cx="240" cy="290" r="11" fill="#f1f4f4" stroke="#9aa5a5"/>
        <text class="label" x="240" y="330">砂時計</text>
      </g>

      <g id="lux-aquarium">
        <title>ルクスの水槽</title>
        <rect x="300" y="140" width="130" height="84" fill="#d8e8ef" stroke="#5f7f8f" stroke-width="1.5"/>
        <text class="label" x="365" y="246">ルクスの水槽</text>

        <g id="lux">
          <title>ルクス（赤い石を持っているタコ）</title>
          <g stroke="#555" stroke-width="1.5" stroke-linecap="round" fill="none">
            <path d="M 361.0 182.0 Q 366.9 179.9 368.7 188.7"/>
            <path d="M 358.4 188.4 Q 364.0 191.0 359.0 198.6"/>
            <path d="M 352.0 191.0 Q 354.1 196.9 345.3 198.7"/>
            <path d="M 345.6 188.4 Q 343.0 194.0 335.4 189.0"/>
            <path d="M 343.0 182.0 Q 337.1 184.1 335.3 175.3"/>
            <path d="M 345.6 175.6 Q 340.0 173.0 345.0 165.4"/>
            <path d="M 352.0 173.0 Q 349.9 167.1 358.7 165.3"/>
            <path d="M 358.4 175.6 Q 361.0 170.0 368.6 175.0"/>
          </g>
          <circle cx="352" cy="182" r="9" fill="#fff" stroke="#555" stroke-width="1.5"/>

          <g id="red-stone">
            <title>赤い石</title>
            <circle cx="360.2" cy="201.3" r="3.5" fill="#c0392b"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <g id="map-labels">
    <text x="60" y="62" font-size="24px">空、鶴を聴く　部屋の見取り図</text>
    <text x="60" y="92" font-size="14px" fill="#666">第一版（骨組み）</text>

    <g id="compass">
      <path d="M 920 104 L 920 66" stroke="#555" stroke-width="1.5"/>
      <path d="M 914 74 L 920 60 L 926 74 Z" fill="#555"/>
      <text x="920" y="50" font-size="15px" text-anchor="middle">北</text>
    </g>

    <text class="wall-name" x="500" y="140">北の壁</text>
    <text class="wall-name" x="840" y="340">東の壁</text>
    <text class="wall-name" x="500" y="972">南の壁</text>
    <text class="wall-name" x="160" y="340">西の壁</text>

    <text class="note" x="60" y="1010">床は上から見た図。四方の壁は、床のふちを折り目にして外側へ倒して描いています。</text>
    <text class="note" x="60" y="1032">壁の中のものは、その壁に向かって立ったときの向きです（西の壁は、首を左にかしげると正面から見た向きになります）。</text>
  </g>
</svg>
